  <!--
      GitHub Pages SPA redirect — decode script.
      When 404.html redirects to /?p=... this script restores the real path
      so React Router picks up the correct route without a page reload.
    -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var p = params.get('p');
      var h = params.get('h');
      if (p) {
        window.history.replaceState(
          null, null,
          p + (h ? decodeURIComponent(h) : '')
        );
      }
    })();
  </script>
