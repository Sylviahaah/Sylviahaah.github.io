  <link rel="preconnect" href="https://fonts.googleapis.com">

    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <!--
      GitHub Pages SPA redirect — decode script.
      When 404.html redirects to /?p=... this script restores the real path
      so React Router picks up the correct route without a page reload.
    -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var p = params.get('p');
      var h = params.get('h');
      if (p) {
        window.history.replaceState(
          null, null,
          p + (h ? decodeURIComponent(h) : '')
        );
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
